apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotas
  namespace: ops-lab
  labels:
    app: rotas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rotas
  template:
    metadata:
      labels:
        app: rotas
    spec:
      containers:
        - name: rotas
          image: rotas:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
